site_url: https://cipfpbatoi.github.io/mkdocs-sx/
repo_url: https://github.com/cipfpbatoi/mkdocs-sx
repo_name: cipfpbatoi/mkdocs-sx
edit_uri: ""   # el contingut s'edita a GitBook, no ací
copyright: Arturo Candela · CIPFP Batoi

theme:
  name: material
  language: ca
  favicon: images/favicon.svg
  icon:
    logo: material/lan
    repo: fontawesome/brands/github
    admonition:
      info: material/information-outline
      warning: material/alert-outline
      danger: material/alert-octagon-outline
      tip: material/lightbulb-on-outline
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navegació
    - navigation.tabs          # una pestanya per situació d'aprenentatge
    - navigation.tabs.sticky   # les pestanyes no desapareixen en fer scroll
    - navigation.sections      # grups (Píndoles, Pràctiques...) com a seccions
    - navigation.path          # breadcrumbs damunt del títol
    - navigation.footer        # botons anterior / següent
    - navigation.top           # botó "tornar a dalt"
    - navigation.tracking      # l'URL segueix l'apartat visible
    - navigation.instant
    - navigation.instant.progress
    # Taula de continguts (a la dreta)
    - toc.follow
    # Cerca
    - search.suggest
    - search.highlight
    - search.share
    # Codi
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Mode clar
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Mode automàtic

extra:
  generator: false
  social:
    - icon: material/web
      link: https://portal.edu.gva.es/blogs/s1/arturocandela/
      name: Blog d'Arturo Candela
    - icon: fontawesome/brands/github
      link: https://github.com/cipfpbatoi/mkdocs-sx
      name: Repositori a GitHub

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:               # clic sobre una captura per ampliar-la
      skip_classes: [no-zoom]
      zoomable: true
  - page-to-pdf              # botó "PDF" a cada pàgina
  - print-site:              # /print_page.html per traure-ho tot en un PDF
      add_to_navigation: false
      print_page_title: "Imprimir tot el lloc"
      add_cover_page: true
      add_table_of_contents: true

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details          # admonitions plegables
  - pymdownx.inlinehilite
  - pymdownx.keys             # ++ctrl+c++
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
