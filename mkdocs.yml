extra:
  contact:
    name: "Arturo Candela"
    email: "a.candelamolto+poo@edu.gva.es"
    blog: "https://portal.edu.gva.es/blogs/s1/arturocandela/"


site_url: https://arturocandela.github.io/temari-pes-osc/
repo_url: https://github.com/arturocandela/temari-pes-osc
repo_name: temari-pes-osc

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Mode clar

plugins:
  - search
  - page-to-pdf     # Botó “Download PDF” per pàgina
  - print-site:     # /print_page per traure-ho tot en un PDF del navegador
      add_to_navigation: false
      print_page_title: "Imprimir tot el lloc"

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details          # admonitions plegables
  - pymdownx.superfences      # blocs de codi/mermaid
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      linenums: true          # numeració de línies
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

# Mermaid (diagrames)
extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js
